                    <div className="card-std p-6 bg-gradient-to-r from-slate-800 to-slate-900 text-white relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="palmtree" size={100} /></div>
                        <div className="grid md:grid-cols-2 gap-6 relative z-10">
                            <div>
                                <p className="text-slate-300 text-sm mb-1 flex items-center gap-2">
                                    เป้าหมายเงินเกษียณ (Total Required)
                                    <button onClick={() => setIsEditingGoal(!isEditingGoal)} className="text-emerald-400 hover:text-emerald-300 bg-white/10 p-1 rounded-full">
                                        <Icon name="pencil" size={12} />
                                    </button>
                                </p>
                                {isEditingGoal ? (
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="number" step="0.01" autoFocus defaultValue={Math.round(requiredFund)}
                                            onBlur={(e) => { handleGoalUpdate(e.target.value); setIsEditingGoal(false); }}
                                            onKeyDown={(e) => { if(e.key === 'Enter') { handleGoalUpdate(e.target.value); setIsEditingGoal(false); } }}
                                            className="bg-slate-800 text-white text-2xl font-bold rounded px-2 py-1 w-full outline-none border border-emerald-500"
                                        />
                                        <button onClick={()=>setIsEditingGoal(false)} className="text-xs text-slate-300">เสร็จสิ้น</button>
                                    </div>
                                ) : (
                                    <h3 className="text-3xl font-bold text-emerald-400 cursor-pointer" onClick={() => setIsEditingGoal(true)}>{formatMoney(requiredFund)}</h3>
                                )}
                                
                                <div className="mt-4">
                                    <div className="flex justify-between text-xs mb-1 text-slate-300">
                                        <span>ความคืบหน้า (มีแล้ว {formatMoney(currentSavings)})</span>
                                        <span>{progressPercent.toFixed(1)}%</span>
                                    </div>
                                    <div className="w-full bg-white/20 h-2 rounded-full overflow-hidden">
                                        <div className="bg-emerald-500 h-full transition-all duration-1000" style={{ width: `${progressPercent}%` }}></div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-col justify-center items-end text-right">
                                <p className="text-slate-300 text-sm">ต้องออมเพิ่มต่อเดือน</p>
                                <h3 className="text-4xl font-bold text-yellow-400">{formatMoney(suggestedSaving)}</h3>
                                <p className="text-xs text-slate-400 mt-1">*เพื่อให้ถึงเป้าหมายใน {yearsToInvest} ปี</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid lg:grid-cols-3 gap-6">
                        <div className="card-std p-5 space-y-4 h-fit">
                            <h3 className="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2 border-b dark:border-slate-700 pb-2">
                                <Icon name="settings-2" size={18}/> ข้อมูลส่วนตัว
                            </h3>
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="text-xs text-slate-500 dark:text-slate-400 font-bold">อายุปัจจุบัน</label><input type="number" value={localParams.currentAge} onChange={e=>setLocalParams({...localParams,currentAge:e.target.value})} className="input-std"/></div>
                                <div><label className="text-xs text-slate-500 dark:text-slate-400 font-bold">เกษียณตอน</label><input type="number" value={localParams.retireAge} onChange={e=>setLocalParams({...localParams,retireAge:e.target.value})} className="input-std"/></div>
                            </div>
                            <div><label className="text-xs text-slate-500 dark:text-slate-400 font-bold">อายุขัยคาดการณ์</label><input type="number" value={localParams.lifeExpectancy} onChange={e=>setLocalParams({...localParams,lifeExpectancy:e.target.value})} className="input-std"/></div>
                            <div><label className="text-xs text-slate-500 dark:text-slate-400 font-bold">เงินเก็บที่มีเพื่อเกษียณ</label><input type="number" step="0.01" value={localParams.currentSavings} onChange={e=>setLocalParams({...localParams,currentSavings:e.target.value})} className="input-std bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-400 font-bold"/></div>
                            <div><label className="text-xs text-slate-500 dark:text-slate-400 font-bold">ต้องการใช้หลังเกษียณ/เดือน</label><input type="number" step="0.01" value={localParams.expenseAfterRetire} onChange={e=>setLocalParams({...localParams,expenseAfterRetire:e.target.value})} className="input-std bg-orange-50 dark:bg-orange-900/20 border-orange-200 dark:border-orange-800 text-orange-700 dark:text-orange-400 font-bold"/></div>
                        </div>

                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm">
                                <h3 className="font-bold text-slate-700 dark:text-slate-200 mb-4 flex items-center gap-2">
                                    <Icon name="check-square" size={18} className="text-blue-500 dark:text-blue-400"/> แผนปฏิบัติการ (Action Plan)
                                </h3>
                                <div className="flex flex-col md:flex-row gap-4 items-center bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-800/50 mb-4">
                                    <div className="flex-1">
                                        <p className="font-bold text-blue-800 dark:text-blue-300 text-sm">1. ยืนยันแผนการออม</p>
                                        <p className="text-xs text-blue-600 dark:text-blue-400">ระบบจะสร้างการแจ้งเตือนให้คุณออม {formatMoney(suggestedSaving)} ทุกเดือน</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs text-blue-500 dark:text-blue-400">เตือนทุกวันที่:</span>
                                        <input type="number" min="1" max="31" value={editDay} onChange={e=>setEditDay(e.target.value)} className="w-12 p-1 text-center border dark:border-slate-600 rounded text-sm dark:bg-slate-800 dark:text-white"/>
                                        <button onClick={handleSaveSettings} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm transition">บันทึกแผนนี้</button>
                                    </div>
                                </div>
                                <div className="flex flex-col md:flex-row gap-4 items-center bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-xl border border-emerald-100 dark:border-emerald-800/50">
                                    <div className="flex-1">
                                        <p className="font-bold text-emerald-800 dark:text-emerald-300 text-sm">2. ลงมือทำทันที</p>
                                        <p className="text-xs text-emerald-600 dark:text-emerald-400">กดปุ่มนี้เมื่อคุณโอนเงินเข้าบัญชีเงินออมแล้ว ระบบจะบันทึกรายจ่ายและเพิ่มยอดสะสมให้</p>
                                    </div>
                                    <button onClick={handleAddSaving} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl text-sm font-bold shadow-md hover:shadow-lg transition flex items-center gap-2">
                                        <Icon name="piggy-bank" size={18}/> ออมเงิน {formatMoney(savingToUse)}
                                    </button>
                                </div>
                            </div>

                            <div className="card-std p-5">
                                <h3 className="font-bold text-slate-700 dark:text-slate-200 mb-2">เส้นทางการเติบโตของเงินออม</h3>
                                <div className="h-64 w-full text-xs">
                                    {window.Recharts && (
                                        <ResponsiveContainer>
                                            <AreaChart data={calculation.chart}>
                                                <defs>
                                                    <linearGradient id="colorBal" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor="#059669" stopOpacity={0.8}/>
                                                        <stop offset="95%" stopColor="#059669" stopOpacity={0}/>
                                                    </linearGradient>
                                                </defs>
                                                <CartesianGrid strokeDasharray="3 3"/>
                                                <XAxis dataKey="age" label={{ value: 'อายุ', position: 'insideBottom', offset: -5 }}/>
                                                <YAxis tickFormatter={v=>`${(v/1000000).toFixed(1)}M`}/>
                                                <Tooltip formatter={v=>formatMoney(v)} labelFormatter={v=>`อายุ ${v} ปี`}/>
                                                <Area type="monotone" dataKey="balance" stroke="#059669" fill="url(#colorBal)" name="เงินสะสม"/>
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    )}
                                </div>
                                <p className="text-center text-xs text-slate-400 mt-2">กราฟแสดงยอดเงินสะสมคาดการณ์จนถึงอายุ {retireAge} ปี</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 7. Debts ---
        const Debts = ({ data, onUpdateDebts, onBatchAddTransaction }) => {
            const [tab, setTab] = useState('list');
            const [isEditing, setIsEditing] = useState(false);
            const [form, setForm] = useState({ id: null, type: 'debt', name: '', amount: '', installment: '', dueDay: '1', rate: '' });
            
            const debtsWithProgress = useMemo(() => {
                return data.debts.map(d => {
                    const isRecurring = d.type === 'recurring';
                    const paidMonth = data.transactions.some(t => {
                        const currentMonth = new Date().toISOString().slice(0, 7);
                        return t.type === 'expense' && t.date.startsWith(currentMonth) && t.note?.includes(d.name);
                    });

                    if (isRecurring) {
                        return { ...d, isRecurring: true, paidMonth };
                    } else {
                        const paid = data.transactions.filter(t => t.type === 'expense' && t.note && t.note.includes(d.name)).reduce((a,b) => a + parseFloat(b.amount), 0);
                        const remaining = Math.max(0, d.amount - paid);
                        return { ...d, isRecurring: false, paid, remaining, percent: Math.min((paid/d.amount)*100, 100) };
                    }
                }).sort((a, b) => {
                    if (a.isRecurring === b.isRecurring) return (b.rate || 0) - (a.rate || 0);
                    return a.isRecurring ? 1 : -1; 
                });
            }, [data.debts, data.transactions]);

            const summary = useMemo(() => {
                return debtsWithProgress.filter(d => !d.isRecurring).reduce((acc, cur) => {
                    acc.totalAmount += cur.amount;
                    acc.totalPaid += cur.paid;
                    acc.totalRemaining += cur.remaining;
                    return acc;
                }, { totalAmount: 0, totalPaid: 0, totalRemaining: 0 });
            }, [debtsWithProgress]);

            const handlePayDebt = (debt) => {
                if (!validateBalance(debt.installment, data.transactions)) return;

                const isRecurring = debt.type === 'recurring';
                const actionName = isRecurring ? `จ่ายบิล "${debt.name}"` : `ชำระหนี้ "${debt.name}"`;
                
                if(confirm(`ยืนยันการ ${actionName} ยอด ${formatMoney(debt.installment)} ประจำเดือนนี้?`)) {
                    onBatchAddTransaction([{
                        id: generateId(),
                        type: 'expense',
                        amount: debt.installment,
                        category: isRecurring ? 'รายจ่ายประจำ' : 'หนี้สิน',
                        date: new Date().toISOString().split('T')[0],
                        note: `Auto: ${isRecurring ? 'จ่ายบิล' : 'ผ่อน'} ${debt.name}`
                    }]);
                }
            };

            const handleSubmitDebt = (e) => {
                e.preventDefault();
                if(!form.name || !form.installment) return alert('กรุณากรอกชื่อและยอดที่ต้องจ่ายต่อเดือน');
                
                const newDebt = {
                    id: form.id || generateId(),
                    type: form.type,
                    name: form.name,
                    amount: form.type === 'recurring' ? 0 : parseFloat(form.amount) || 0,
                    installment: parseFloat(form.installment) || 0,
                    rate: form.type === 'recurring' ? 0 : parseFloat(form.rate) || 0,
                    dueDay: form.dueDay || '1'
                };

                if (isEditing) {
                    onUpdateDebts(data.debts.map(d => d.id === newDebt.id ? newDebt : d));
                    setIsEditing(false);
                } else {
                    onUpdateDebts([...data.debts, newDebt]);
                }
                
                setForm({ id: null, type: form.type, name: '', amount: '', installment: '', dueDay: '1', rate: '' });
            };

            const handleEditClick = (debt) => {
                setForm({
                    id: debt.id,
                    type: debt.type || 'debt',
                    name: debt.name,
                    amount: debt.amount || '',
                    installment: debt.installment || '',
                    dueDay: debt.dueDay || '1',
                    rate: debt.rate || ''
                });
                setIsEditing(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="space-y-6 pb-24 animate-fade-in">
                    <div className="flex gap-4 border-b border-slate-200 dark:border-slate-700 pb-2">
                        <button onClick={()=>setTab('list')} className={`font-bold pb-2 px-2 ${tab==='list'?'text-primary dark:text-emerald-400 border-b-2 border-primary dark:border-emerald-400':'text-slate-400 dark:text-slate-500'}`}>รายการทั้งหมด</button>
                        <button onClick={()=>setTab('strategy')} className={`font-bold pb-2 px-2 ${tab==='strategy'?'text-primary dark:text-emerald-400 border-b-2 border-primary dark:border-emerald-400':'text-slate-400 dark:text-slate-500'}`}>กลยุทธ์แก้หนี้</button>
                    </div>

                    {tab === 'list' && (
                        <>
                            <div className="grid grid-cols-3 gap-3 md:gap-4 mb-2">
                                <div className="bg-slate-100 dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 flex flex-col justify-center">
                                    <p className="text-[10px] md:text-xs text-slate-500 dark:text-slate-400">ยอดหนี้เริ่มต้นรวม</p>
                                    <p className="font-bold text-sm md:text-base text-slate-700 dark:text-slate-200">{formatMoney(summary.totalAmount)}</p>
                                </div>
                                <div className="bg-blue-50 dark:bg-blue-900/20 p-3 rounded-xl border border-blue-100 dark:border-blue-800/30 flex flex-col justify-center">
                                    <p className="text-[10px] md:text-xs text-blue-600 dark:text-blue-400">จ่ายแล้วรวม</p>
                                    <p className="font-bold text-sm md:text-base text-blue-700 dark:text-blue-300">{formatMoney(summary.totalPaid)}</p>
                                </div>
                                <div className="bg-red-50 dark:bg-red-900/20 p-3 rounded-xl border border-red-200 dark:border-red-800/50 flex flex-col justify-center relative overflow-hidden">
                                    <div className="absolute -right-2 -bottom-2 opacity-10"><Icon name="alert-triangle" size={40}/></div>
                                    <p className="text-[10px] md:text-xs font-bold text-red-600 dark:text-red-400">ยอดค้างชำระรวม</p>
                                    <p className="font-bold text-base md:text-lg text-red-700 dark:text-red-300 z-10">{formatMoney(summary.totalRemaining)}</p>
                                </div>
                            </div>

                            <form onSubmit={handleSubmitDebt} className={`card-std p-5 mt-4 border-l-4 ${isEditing ? 'border-l-orange-500' : 'border-l-primary'}`}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-slate-700 dark:text-slate-200">{isEditing ? 'แก้ไขรายการ' : 'เพิ่มรายการใหม่'}</h3>
                                    {isEditing && (
                                        <button type="button" onClick={() => { setIsEditing(false); setForm({ id: null, type: 'debt', name: '', amount: '', installment: '', dueDay: '1', rate: '' }); }} className="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">ยกเลิกแก้ไข</button>
                                    )}
                                </div>
                                
                                <div className="flex bg-slate-100 dark:bg-slate-700 p-1 rounded-xl mb-4 w-full md:w-1/2">
                                    <button type="button" onClick={() => setForm({...form, type: 'debt'})} className={`flex-1 py-1.5 text-xs md:text-sm font-bold rounded-lg transition ${form.type === 'debt' ? 'bg-white dark:bg-slate-600 text-red-600 dark:text-red-400 shadow' : 'text-slate-500 dark:text-slate-300'}`}>หนี้สินทั่วไป</button>
                                    <button type="button" onClick={() => setForm({...form, type: 'recurring'})} className={`flex-1 py-1.5 text-xs md:text-sm font-bold rounded-lg transition ${form.type === 'recurring' ? 'bg-white dark:bg-slate-600 text-blue-600 dark:text-blue-400 shadow' : 'text-slate-500 dark:text-slate-300'}`}>รายจ่ายประจำ (บิล)</button>
                                </div>

                                <div className="grid md:grid-cols-6 gap-3">
                                    <div className="md:col-span-2">
                                        <label className="text-xs text-slate-500 dark:text-slate-400 block mb-1">ชื่อรายการ {form.type === 'recurring' && '(เช่น ค่าไฟ, ค่าเน็ต)'}</label>
                                        <input required placeholder="ระบุชื่อ" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="input-std text-sm py-2"/>
                                    </div>
                                    
                                    {form.type === 'debt' && (
                                        <>
                                            <div>
                                                <label className="text-xs text-slate-500 dark:text-slate-400 block mb-1">ยอดหนี้ทั้งหมด</label>
                                                <input required type="number" step="0.01" placeholder="0" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} className="input-std text-sm py-2"/>
                                            </div>
                                            <div>
                                                <label className="text-xs text-slate-500 dark:text-slate-400 block mb-1">ดอกเบี้ย % (ต่อปี)</label>
                                                <input type="number" step="0.01" placeholder="0" value={form.rate} onChange={e=>setForm({...form,rate:e.target.value})} className="input-std text-sm py-2"/>
                                            </div>
                                        </>
                                    )}

                                    <div className={form.type === 'recurring' ? 'md:col-span-2' : ''}>
                                        <label className="text-xs text-slate-500 dark:text-slate-400 block mb-1">ยอดที่ต้องจ่าย/เดือน</label>
                                        <input required type="number" step="0.01" placeholder="0" value={form.installment} onChange={e=>setForm({...form,installment:e.target.value})} className="input-std text-sm py-2 font-bold text-red-500"/>
                                    </div>
                                    
                                    <div className={form.type === 'recurring' ? 'md:col-span-2' : ''}>
                                        <label className="text-xs text-slate-500 dark:text-slate-400 block mb-1">จ่ายทุกวันที่ (1-31)</label>
                                        <input required type="number" min="1" max="31" value={form.dueDay} onChange={e=>setForm({...form,dueDay:e.target.value})} className="input-std text-sm py-2 text-center"/>
                                    </div>
                                    
                                    <button type="submit" className={`md:col-span-6 mt-2 py-3 rounded-xl font-bold text-white shadow-md transition ${isEditing ? 'bg-orange-500 hover:bg-orange-600' : 'bg-primary hover:bg-emerald-700'}`}>
                                        {isEditing ? 'บันทึกการเปลี่ยนแปลง' : 'เพิ่มรายการ'}
                                    </button>
                                </div>
                            </form>

                            <div className="space-y-3 mt-6">
                                <h3 className="font-bold text-slate-700 dark:text-slate-200 mb-2">รายการที่ต้องจ่ายทั้งหมด</h3>
                                {debtsWithProgress.map(d => {
                                    const isCleared = !d.isRecurring && d.remaining <= 0;
                                    
                                    return (
                                        <div key={d.id} className={`card-std p-4 ${isCleared ? 'opacity-70 bg-emerald-50 dark:bg-emerald-900/10 border-emerald-200' : ''}`}>
                                            <div className="flex justify-between items-start mb-2">
                                                <div>
                                                    <h4 className="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                                                        {d.isRecurring ? <Icon name="receipt" size={16} className="text-blue-500"/> : <Icon name="credit-card" size={16} className="text-red-500"/>}
                                                        {d.name} 
                                                        {!d.isRecurring && <span className="text-xs bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400 px-2 py-0.5 rounded ml-1">ดอกเบี้ย {d.rate}%</span>}
                                                        {d.isRecurring && <span className="text-xs bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded ml-1">บิลประจำ</span>}
                                                    </h4>
                                                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                                                        ต้องจ่ายวันที่ {d.dueDay} | ยอดต่อเดือน: <span className="font-bold">{formatMoney(d.installment)}</span>
                                                    </p>
                                                    {!d.isRecurring && <p className="text-xs text-slate-400 mt-1">ยอดหนี้เริ่มต้น: {formatMoney(d.amount)}</p>}
                                                </div>
                                                <div className="text-right">
                                                    {!d.isRecurring && (
                                                        <>
                                                            {isCleared ? (
                                                                <span className="text-emerald-600 dark:text-emerald-400 font-bold flex items-center gap-1"><Icon name="check-circle" size={14}/> ปิดยอดแล้ว</span>
                                                            ) : (
                                                                <span className="text-emerald-600 dark:text-emerald-400 font-bold">{d.percent.toFixed(1)}%</span>
                                                            )}
                                                            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">จ่ายไปแล้ว: <span className="text-blue-500">{formatMoney(d.paid)}</span></p>
                                                            {!isCleared && <p className="text-xs text-slate-500 dark:text-slate-400">ค้างชำระ: <span className="text-red-500 font-bold">{formatMoney(d.remaining)}</span></p>}
                                                        </>
                                                    )}
                                                </div>
                                            </div>
                                            
                                            {!d.isRecurring && (
                                                <div className="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden mb-3">
                                                    <div className="bg-emerald-500 h-full transition-all duration-500" style={{width:`${d.percent}%`}}></div>
                                                </div>
                                            )}

                                            <div className="flex justify-between items-center border-t border-slate-100 dark:border-slate-700 pt-3 mt-2">
                                                <div className="flex items-center gap-2">
                                                    {isCleared ? (
                                                        <span className="text-xs text-emerald-600 dark:text-emerald-400">ยินดีด้วย! คุณผ่อนรายการนี้หมดแล้ว 🎉</span>
                                                    ) : d.paidMonth ? (
                                                        <span className="text-xs bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 px-2 py-1.5 rounded font-bold cursor-default flex items-center gap-1"><Icon name="check" size={14}/> ชำระเดือนนี้แล้ว</span>
                                                    ) : (

                setText('');

            const toggleNote = (id) => onUpdateNotes((data.notes||[]).map(n => n.id === id ? { ...n, completed: !n.completed } : n));

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBdMDSDuX6p6mBvJHePwHi273uBTtT7A6E",
        authDomain: "dairy-puzzle-quiz.firebaseapp.com",
        projectId: "dairy-puzzle-quiz",
        storageBucket: "dairy-puzzle-quiz.firebasestorage.app",
        messagingSenderId: "638793633329",
        appId: "1:638793633329:web:95a77f177f2eecc2148f10",
        measurementId: "G-ED5P8T3NPF"
    };

    const isCloudEnv = window.location.protocol !== 'file:';
    let app, auth, db;
    let authChangeCallbacks = [];

    if (isCloudEnv) {
        try {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();

            // Enable offline persistence
            db.enablePersistence().catch((err) => {
                if (err.code == 'failed-precondition') {
                    console.warn("Multiple tabs open, persistence can only be enabled in one tab at a a time.");
                } else if (err.code == 'unimplemented') {
                    console.warn("The current browser does not support all of the features required to enable persistence");
                }
            });

            auth.onAuthStateChanged((user) => {
                authChangeCallbacks.forEach(cb => cb(user));
            });
        } catch (error) {
            console.error("Firebase init failed:", error);
        }
    }

    window.onAuthChange = (cb) => {
        if (!isCloudEnv) return;
        authChangeCallbacks.push(cb);
        if (auth && auth.currentUser) {
            cb(auth.currentUser);
        }
    };

    window.signInWithGoogle = async () => {
        if (!isCloudEnv || !auth) return alert("Firebase disabled: คุณกำลังเปิดไฟล์ html แบบออฟไลน์ (file://) กรุณาใช้งานผ่านลิงก์ EdgeOne ที่โฮสต์ไว้ครับ");
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            await auth.signInWithPopup(provider);
        } catch (error) {
            console.error("Login failed:", error);
            alert("Login failed: " + error.message);
        }
    };

    window.signOutUser = async () => {
        if (!isCloudEnv || !auth) return;
        try {
            await auth.signOut();
        } catch (error) {
            console.error("Sign out failed:", error);
        }
    };

    let unsubscribeProfile = null;
    window.setupRealtimeSync = (uid, onDataReceived, onCloudEmpty) => {
        if (!isCloudEnv || !db) return;
        if (unsubscribeProfile) unsubscribeProfile();
        
        const userRef = db.collection('artifacts').doc('smartmoney_pro_v1').collection('users').doc(uid);
        
        unsubscribeProfile = userRef.collection('save').doc('profile').onSnapshot(async (profileSnap) => {
            if (profileSnap.exists) {
                const profileData = profileSnap.data().db;
                try {
                    // Fetch all transaction chunks
                    const txSnap = await userRef.collection('transactions').get();
                    let allTxs = [];
                    txSnap.forEach(doc => {
                        if (doc.data().txs) allTxs = allTxs.concat(doc.data().txs);
                    });
                    
                    const fullData = { ...profileData, transactions: allTxs };
                    onDataReceived(fullData);
                } catch(err) {
                    console.error("Error fetching transactions", err);
                }
            } else {
                // Backward compatibility: load from legacy document if profile doesn't exist
                const legacyDocRef = userRef.collection('save').doc('data');
                legacyDocRef.get().then(docSnap => {
                    if (docSnap.exists) {
                        onDataReceived(docSnap.data().db);
                    } else {
                        if (onCloudEmpty) onCloudEmpty();
                    }
                }).catch(err => {
                    console.error("Legacy load failed", err);
                });
            }
        });
        return unsubscribeProfile;
    };

    window.saveToCloud = async (uid, data) => {
        if (!isCloudEnv || !db) return;
        try {
            const batch = db.batch();
            const userRef = db.collection('artifacts').doc('smartmoney_pro_v1').collection('users').doc(uid);
            
            // Separate transactions from profile to bypass 1MB limit
            const { transactions, ...profileData } = data;
            
            batch.set(userRef.collection('save').doc('profile'), { db: profileData, updated_at: new Date().toISOString() });
            
            if (transactions && transactions.length > 0) {
                // Group transactions by YYYY-MM
                const txByMonth = {};
                transactions.forEach(t => {
                    const monthStr = t.date ? t.date.substring(0, 7) : 'unknown';
                    if(!txByMonth[monthStr]) txByMonth[monthStr] = [];
                    txByMonth[monthStr].push(t);
                });
                
                // Write each month chunk
                for (const month in txByMonth) {
                    batch.set(userRef.collection('transactions').doc(month), { txs: txByMonth[month] });
                }
            }
            
            await batch.commit();
        } catch (error) {
            console.error("Cloud save failed:", error);
        }
    };
</script>
