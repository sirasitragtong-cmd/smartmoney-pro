<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartMoney Pro - บริหารการเงินครบวงจร</title>
    <!-- App Icons -->
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#0f172a">

    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Prop Types -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Suppress specific React warnings
        const originalError = console.error;
        console.error = (...args) => {
            if (/Support for defaultProps will be removed/.test(args[0])) return;
            originalError(...args);
        };

        tailwind.config = {
            darkMode: 'class', // Enable Dark Mode
            theme: {
                extend: {
                    colors: {
                        primary: '#059669', // Emerald 600
                        primaryLight: '#ecfdf5', // Emerald 50
                        secondary: '#3b82f6', // Blue 500
                        accent: '#f59e0b', // Amber 500
                        danger: '#ef4444', // Red 500
                        dark: '#0f172a', // Slate 900
                        surface: '#ffffff',
                        background: '#f8fafc', // Slate 50
                    },
                    fontFamily: {
                        sans: ['Sarabun', 'sans-serif', 'system-ui'],
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; transition: background-color 0.3s, color 0.3s; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-std { background: white; border-radius: 1rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1); border: 1px solid #f1f5f9; transition: all 0.2s; }
        .card-std:hover { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .input-std { width: 100%; padding: 0.75rem; background-color: #f8fafc; border-radius: 0.75rem; border: 1px solid #e2e8f0; outline: none; transition: all 0.2s; }
        .input-std:focus { border-color: #059669; box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.1); background-color: #fff; }
        .btn-primary { background-color: #059669; color: white; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: 600; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2); display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; }
        .btn-primary:hover { background-color: #047857; transform: translateY(-1px); }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Modal Animation */
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms; }
        .modal-exit { opacity: 1; }
        .modal-exit-active { opacity: 0; transform: scale(0.9); transition: opacity 300ms, transform 300ms; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        
        /* Dark Mode Overrides */
        body.dark { background-color: #0f172a; color: #f1f5f9; }
        .dark .card-std { background: #1e293b; border-color: #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .dark .input-std { background-color: #0f172a; border-color: #334155; color: #f1f5f9; }
        .dark .input-std:focus { border-color: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); background-color: #1e293b; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
        
        /* Recharts Dark Mode Fixes */
        .dark .recharts-text { fill: #94a3b8 !important; }
        .dark .recharts-cartesian-grid line { stroke: #334155 !important; }
        .dark .recharts-tooltip-wrapper .recharts-default-tooltip { background-color: #1e293b !important; border-color: #334155 !important; color: #f8fafc !important; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .dark .recharts-tooltip-item { color: #e2e8f0 !important; }
    </style>
    <!-- Anti-Copy Shield -->
    <style>
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable="true"] {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }
    </style>
    <script>
        document.addEventListener('contextmenu', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
            e.preventDefault();
        });
        document.addEventListener('keydown', e => {
            const key = e.key ? e.key.toUpperCase() : '';
            if (key === 'F12' || 
               (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(key)) ||
               (e.ctrlKey && key === 'U') ||
               (e.metaKey && e.altKey && ['I', 'J', 'C'].includes(key)) ||
               (e.metaKey && key === 'U')) {
                e.preventDefault();
            }
        });
        document.addEventListener('dragstart', e => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { PieChart, Pie, Cell, ResponsiveContainer, BarChart, Bar, LineChart, Line, XAxis, YAxis, Tooltip, Legend, CartesianGrid, AreaChart, Area, ComposedChart, Scatter } = window.Recharts || {};

        const Icon = ({ name, size = 20, className = "" }) => {
            const ref = useRef(null);
            
            useEffect(() => {
                if (window.lucide && ref.current) {
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.setAttribute('width', size);
                    iconElement.setAttribute('height', size);
                    if (className) iconElement.setAttribute('class', className);
                    
                    ref.current.innerHTML = '';
                    ref.current.appendChild(iconElement);
                    
                    window.lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: { width: size, height: size, class: className }
                    });
                }
            }, [name, size, className]);

            return <span ref={ref} style={{ display: 'inline-flex', verticalAlign: 'middle' }}></span>;
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const formatMoney = (amount) => {
            const num = parseFloat(amount);
            if (isNaN(num)) return '฿0.00';
            return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
        };
        const COLORS = ['#059669', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b', '#14b8a6'];
        const COLORS_ALT = ['#8b5cf6', '#ec4899', '#f59e0b', '#14b8a6', '#3b82f6', '#ef4444', '#059669', '#64748b'];

        // --- Global Balance Helpers ---
        const calculateTotalBalance = (transactions) => {
            return transactions.reduce((acc, t) => acc + (t.type === 'income' ? parseFloat(t.amount) : -parseFloat(t.amount)), 0);
        };

        const validateBalance = (amountToSpend, transactions) => {
            const currentBalance = calculateTotalBalance(transactions);
            if (amountToSpend > currentBalance) {
                const shortage = amountToSpend - currentBalance;
                alert(`❌ ยอดเงินคงเหลือไม่พอสำหรับทำรายการ!\n\nยอดคงเหลือปัจจุบัน: ${formatMoney(currentBalance)}\nจำนวนเงินที่ต้องการ: ${formatMoney(amountToSpend)}\n\n⚠️ คุณขาดเงินอีก: ${formatMoney(shortage)}`);
                return false;
            }
            return true;
        };

        // --- Notification Modal Component ---
        const NotificationModal = ({ actions, onClose, onProcess, onNavigate }) => {
            const sortedActions = [...actions].sort((a, b) => {
                if (a.isPaid === b.isPaid) return 0;
                return a.isPaid ? 1 : -1;
            });

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden relative">
                        <div className="bg-primary p-4 text-white flex justify-between items-center">
                            <h3 className="font-bold text-lg flex items-center gap-2"><Icon name="bell-ring" /> แจ้งเตือนการชำระเงิน</h3>
                            <button onClick={onClose} className="text-white/80 hover:text-white"><Icon name="x" /></button>
                        </div>
                        <div className="p-4 space-y-3 max-h-[60vh] overflow-y-auto">
                            {sortedActions.length === 0 ? (
                                <div className="text-center py-10 text-slate-400 flex flex-col items-center">
                                    <Icon name="check-circle-2" size={48} className="text-emerald-200 dark:text-emerald-800 mb-3"/>
                                    <p>ไม่มีรายการแจ้งเตือนค้างชำระ</p>
                                    <p className="text-xs">สบายใจได้! เดือนนี้คุณจัดการทุกอย่างเรียบร้อยแล้ว</p>
                                </div>
                            ) : (
                                <>
                                    <p className="text-sm text-slate-500 dark:text-slate-400 mb-2">รายการที่ถึงกำหนดชำระในรอบเดือนนี้:</p>
                                    {sortedActions.map((action) => (
                                        <div key={action.id} className={`flex justify-between items-center p-3 rounded-xl border transition ${action.isPaid ? 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-100 dark:border-emerald-800/30 opacity-70' : action.type === 'budget_alert' ? 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800/30' : 'bg-white dark:bg-slate-700 border-slate-200 dark:border-slate-600 shadow-sm hover:border-red-300 dark:hover:border-red-500/50'}`}>
                                            <div className="flex items-center gap-3 flex-1 cursor-pointer" onClick={() => action.type !== 'budget_alert' && onNavigate(action.type)}>
                                                {action.isPaid ? (
                                                    <div className="w-8 h-8 rounded-full bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center"><Icon name="check" size={16}/></div>
                                                ) : action.type === 'budget_alert' ? (
                                                    <div className="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center animate-pulse"><Icon name="alert-triangle" size={16}/></div>
                                                ) : (
                                                    <div className="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400 flex items-center justify-center relative">
                                                        <Icon name="alert-circle" size={16}/>
                                                        <span className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white dark:border-slate-800"></span>
                                                    </div>
                                                )}
                                                <div>
                                                    <p className={`font-bold text-sm hover:text-blue-600 dark:hover:text-blue-400 hover:underline ${action.isPaid ? 'text-emerald-700 dark:text-emerald-500 line-through' : 'text-slate-700 dark:text-slate-200'}`}>{action.title}</p>
                                                    <p className="text-xs text-slate-400 dark:text-slate-500">กำหนด: {action.due}</p>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <p className="font-bold text-slate-700 dark:text-slate-200 text-sm">{formatMoney(action.amount)}</p>
                                                {action.isPaid ? (
                                                    <span className="text-[10px] bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 px-2 py-1 rounded inline-block mt-1 font-bold">จ่ายแล้ว</span>
                                                ) : action.type !== 'budget_alert' && (
                                                    <button onClick={() => onProcess(action)} className="text-[10px] bg-red-500 text-white px-3 py-1.5 rounded-lg mt-1 hover:bg-red-600 shadow-sm font-bold animate-pulse">จ่ายเลย</button>
                                                )}
                                                {action.type === 'budget_alert' && (
                                                    <span className="text-[10px] bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400 px-2 py-1 rounded inline-block mt-1 font-bold">เกินงบ!</span>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    <p className="text-center text-[10px] text-slate-400 mt-2">*คลิกที่ชื่อรายการเพื่อไปหน้าแก้ไข</p>
                                </>
                            )}
                        </div>
                        <div className="p-4 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700 text-center">
                            <button onClick={onClose} className="text-slate-400 text-sm hover:text-slate-600 dark:hover:text-slate-300">ปิดหน้าต่าง</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 1. Dashboard ---
        const Dashboard = ({ data, onChangeView, onProcessAction, onUpdateNotes, onUpdateBudgets }) => {
            const now = new Date();
            const currentMonthStr = now.toISOString().slice(0, 7);

            const cumulativeCash = calculateTotalBalance(data.transactions);

            const dcaTotal = useMemo(() => {
                let total = 0;
                data.transactions.forEach(t => {
                    if (t.type === 'expense' && t.note && (t.note.includes('Auto: ออม DCA:') || t.note.includes('ลงทุน:'))) {
                        total += parseFloat(t.amount) || 0;
                    }
                    if (t.type === 'income' && t.note && t.note.includes('ถอน DCA:')) {
                        total -= parseFloat(t.amount) || 0;
                    }
                });
                return Math.max(0, total);
            }, [data.transactions]);
            
            const manualAssetsTotal = (data.assets || []).reduce((acc, curr) => acc + (parseFloat(curr.value) || 0), 0);

            const totalRemainingDebts = useMemo(() => {
                return data.debts.filter(d => d.type !== 'recurring').reduce((acc, cur) => {
                    const totalAmount = parseFloat(cur.amount) || 0;
                    const paid = data.transactions
                        .filter(t => t.type === 'expense' && t.note && t.note.includes(cur.name))
                        .reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
                    const remaining = Math.max(0, totalAmount - paid);
                    return acc + remaining;
                }, 0);
            }, [data.debts, data.transactions]);

            const netWorth = cumulativeCash + dcaTotal + manualAssetsTotal - totalRemainingDebts;

            const income = data.transactions
                .filter(t => t.type === 'income' && t.date.startsWith(currentMonthStr))
                .reduce((acc, t) => acc + (parseFloat(t.amount) || 0), 0);
            const expense = data.transactions
                .filter(t => t.type === 'expense' && t.date.startsWith(currentMonthStr))
                .reduce((acc, t) => acc + (parseFloat(t.amount) || 0), 0);
            
            const cashFlow = income - expense;

            const budgets = data.budgets || {};
            const [isEditingBudget, setIsEditingBudget] = useState(false);
            const [newBudgetCategory, setNewBudgetCategory] = useState('');
            const [newBudgetAmount, setNewBudgetAmount] = useState('');

            const categoryExpenses = useMemo(() => {
                const expenses = {};
                data.transactions
                    .filter(t => t.type === 'expense' && t.date.startsWith(currentMonthStr))
                    .forEach(t => {
                        expenses[t.category] = (expenses[t.category] || 0) + (parseFloat(t.amount) || 0);
                    });
                return expenses;
            }, [data.transactions, currentMonthStr]);

            const pendingActions = useMemo(() => {
                const actions = [];
                const isPaid = (keyword, amount) => {
                    return data.transactions.some(t => 
                        t.type === 'expense' && 
                        t.date.startsWith(currentMonthStr) && 
                        (t.note?.includes(keyword) || t.category === keyword) &&
                        Math.abs(t.amount - amount) < 100 
                    );
                };

                data.debts.forEach(d => { 
                    const isRecurring = d.type === 'recurring';
                    const paidThisMonth = isPaid(d.name, d.installment);

                    if (isRecurring) {
                        actions.push({ 
                            id: d.id, 
                            title: `รายจ่ายประจำ: ${d.name}`, 
                            amount: d.installment, 
                            type: 'debt_pay', 
                            due: `ทุกวันที่ ${d.dueDay || 1}`, 
                            isPaid: paidThisMonth 
                        });
                    } else {
                        const paidTotal = data.transactions.filter(t => t.type === 'expense' && t.note && t.note.includes(d.name)).reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
                        if (d.installment > 0 && paidTotal < d.amount) {
                            actions.push({ 
                                id: d.id, 
                                title: `จ่ายหนี้: ${d.name}`, 
                                amount: d.installment, 
                                type: 'debt_pay', 
                                due: `ทุกวันที่ ${d.dueDay || 1}`, 
                                isPaid: paidThisMonth 
                            }); 
                        }
                    }
                });
                
                (data.dcaPlans || []).forEach(p => { if (p.active) actions.push({ id: p.id, title: `ออม DCA: ${p.assetName}`, amount: p.amount, type: 'dca_invest', due: `วันที่ ${p.dayOfMonth}`, isPaid: isPaid(p.assetName, p.amount) }); });
                
                if (data.retirement && data.retirement.autoSaveDay && data.retirement.monthlySaving > 0) {
                    actions.push({ 
                        id: 'retire_auto', 
                        title: 'ออมเงินเกษียณ (Smart Goal)', 
                        amount: data.retirement.monthlySaving, 
                        type: 'retire_save', 
                        due: `วันที่ ${data.retirement.autoSaveDay}`, 
                        isPaid: isPaid('ออมเงินเกษียณ', data.retirement.monthlySaving) 
                    });
                }

                (data.insurance || []).forEach(i => {
                    const isDueThisMonth = i.dueDate && i.dueDate.split('-')[1] === String(now.getMonth() + 1).padStart(2, '0');
                    if (isDueThisMonth || !i.dueDate) actions.push({ id: i.id, title: `จ่ายเบี้ย: ${i.company}`, amount: i.premium, type: 'ins_pay', due: i.dueDate ? `วันที่ ${new Date(i.dueDate).toLocaleDateString('th-TH')}` : 'รายปี', isPaid: isPaid(i.company, i.premium) });
                });

                Object.entries(budgets).forEach(([cat, limit]) => {
                    const used = categoryExpenses[cat] || 0;
                    if (used > limit) {
                        actions.push({
                            id: `budget_alert_${cat}`,
                            title: `งบเกิน! หมวด${cat}`,
                            amount: used - limit,
                            type: 'budget_alert',
                            due: 'แจ้งเตือน',
                            isPaid: false
                        });
                    }
                });

                return actions;
            }, [data, currentMonthStr, budgets, categoryExpenses]);

            const unpaidCount = pendingActions.filter(a => !a.isPaid).length;
            const [showPopup, setShowPopup] = useState(false);
            const [quickNote, setQuickNote] = useState('');

            const handleAddQuickNote = (e) => {
                e.preventDefault();
                if(!quickNote.trim()) return;
                const newNotes = [{ id: generateId(), text: quickNote, completed: false, date: new Date().toISOString() }, ...(data.notes || [])];
                onUpdateNotes(newNotes);
                setQuickNote('');
            };
            const toggleNote = (id) => onUpdateNotes((data.notes||[]).map(n => n.id === id ? { ...n, completed: !n.completed } : n));
            
            const handleAddBudget = () => {
                if (!newBudgetCategory || !newBudgetAmount) return;
                const updatedBudgets = { ...budgets, [newBudgetCategory]: parseFloat(newBudgetAmount) };
                onUpdateBudgets(updatedBudgets);
                setNewBudgetCategory('');
                setNewBudgetAmount('');
            };

            const handleDeleteBudget = (cat) => {
                const updated = { ...budgets };
                delete updated[cat];
                onUpdateBudgets(updated);
            };

            const handleNavigate = (type) => {
                setShowPopup(false);
                if (type === 'debt_pay') onChangeView('debts');
                else if (type === 'dca_invest') onChangeView('assets', 'dca');
                else if (type === 'retire_save') onChangeView('retirement');
                else if (type === 'ins_pay') onChangeView('insurance');
            };

            const defaultExpenseCategories = ['อาหาร', 'เดินทาง', 'ที่อยู่อาศัย', 'ช้อปปิ้ง', 'บันเทิง', 'สุขภาพ', 'การศึกษา', 'หนี้สิน', 'การลงทุน', 'อื่นๆ'];
            const expenseCategories = useMemo(() => {
                return Array.from(new Set([...defaultExpenseCategories, ...(data.customCategories?.expense || [])]));
            }, [data.customCategories]);

            return (
                <div className="space-y-6 pb-24 md:pb-0 animate-fade-in relative">
                    <header className="flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100">ภาพรวมวันนี้</h1>
                            <p className="text-slate-500 dark:text-slate-400 text-sm">ยินดีต้อนรับ, {data.profile.name}</p>
                        </div>
                        <div className="relative cursor-pointer group z-40" onClick={() => setShowPopup(true)}>
                            <div className="w-10 h-10 bg-emerald-100 dark:bg-emerald-900/50 rounded-full flex items-center justify-center text-primary dark:text-emerald-400 relative shadow-sm hover:bg-emerald-200 dark:hover:bg-emerald-800/50 transition">
                                <Icon name="bell" size={20} />
                                {unpaidCount > 0 && <span className="absolute top-0 right-0 w-4 h-4 bg-red-500 text-white text-[9px] flex items-center justify-center rounded-full border-2 border-white dark:border-slate-800 animate-bounce">{unpaidCount}</span>}
                            </div>
                        </div>
                    </header>

                    {showPopup && <NotificationModal actions={pendingActions} onClose={() => setShowPopup(false)} onProcess={onProcessAction} onNavigate={handleNavigate} />}

                    
                    {/* Extra Status Widgets */}
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-5 shadow-sm border border-slate-100 dark:border-slate-700">
                            <p className="text-slate-500 dark:text-slate-400 text-xs font-medium mb-1">รายรับเดือนนี้ (Income)</p>

                        // ตรวจสอบยอดเงินช็อต
                        if (!validateBalance(totalExpenseRequired, data.transactions)) return;
                        
                        onBatchAddTransaction(newTxs); 
                        alert(`✅ บันทึก ${newTxs.length} รายการเรียบร้อย (ยอดรวม ${formatMoney(totalExpenseRequired)})`); 
                    } else { 
                        alert("ไม่พบรายการที่ตรงกับวันนี้"); 
                    } 
                } 
            }; 
            
            const broughtForward = useMemo(() => {
                if (!data.transactions || data.transactions.length === 0) return 0;
                const startOfSelectedMonth = new Date(`${selectedMonth}-01T00:00:00`);
                return data.transactions.reduce((acc, t) => {
                    const txDate = new Date(`${t.date}T00:00:00`);
                    if (txDate < startOfSelectedMonth) {
                        return acc + (t.type === 'income' ? parseFloat(t.amount) : -parseFloat(t.amount));
                    }
                    return acc;
                }, 0);
            }, [data.transactions, selectedMonth]);

            const { dailyData, dailyStats } = useMemo(() => { 
                const [y, m] = selectedMonth.split('-'); 
                const days = new Date(y, m, 0).getDate(); 
                const res = []; 
                let totalExp = 0; 
                let totalInc = 0;
                let maxExp = 0; 
                let maxExpDay = 0; 
                
                for(let i=1; i<=days; i++) { 
                    const dStr = `${selectedMonth}-${String(i).padStart(2,'0')}`; 
                    const txs = data.transactions.filter(t => t.date === dStr); 
                    const inc = txs.filter(t=>t.type==='income').reduce((a,b)=>a+parseFloat(b.amount),0); 
                    const exp = txs.filter(t=>t.type==='expense').reduce((a,b)=>a+parseFloat(b.amount),0); 
                    
                    totalInc += inc;
                    totalExp += exp; 
                    if (exp > maxExp) { maxExp = exp; maxExpDay = i; } 
                    res.push({ day: i, date: dStr, income: inc, expense: exp }); 
                } 
                
                const avgExp = totalExp / days; 
                return { dailyData: res, dailyStats: { totalExp, totalInc, avgExp, maxExp, maxExpDay } }; 
            }, [data.transactions, selectedMonth]); 

            const totalCumulative = broughtForward + dailyStats.totalInc - dailyStats.totalExp;

            const categoryBreakdown = useMemo(() => {
                const expenses = data.transactions.filter(t => t.type === 'expense' && t.date.startsWith(selectedMonth));
                const grouped = {};
                let total = 0;
                
                expenses.forEach(t => {
                    const amt = parseFloat(t.amount);
                    grouped[t.category] = (grouped[t.category] || 0) + amt;
                    total += amt;
                });

                const chartData = Object.entries(grouped)
                    .map(([name, value]) => ({ 
                        name, 
                        value, 
                        percent: total > 0 ? (value / total) * 100 : 0 
                    }))
                    .sort((a, b) => b.value - a.value);

                return { chartData, total };
            }, [data.transactions, selectedMonth]);

            return ( 
                <div className="space-y-6 pb-24 animate-fade-in"> 
                    <div className="flex flex-col md:flex-row justify-between md:items-center gap-4"> 
                        <h2 className="text-2xl font-bold text-slate-800 dark:text-slate-100">สรุปรายเดือน & จัดการรอบบิล</h2> 
                        <div className="flex flex-wrap gap-2"> 
                            <input type="month" value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)} className="input-std w-auto"/> 
                            <div className="flex items-center gap-2 bg-white dark:bg-slate-800 px-3 py-1 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm"> 
                                <span className="text-xs text-slate-500 dark:text-slate-400 font-bold">ดึงรายการรายเดือน:</span> 
                                <input type="date" value={scheduleDate} onChange={e=>setScheduleDate(e.target.value)} className="text-sm outline-none bg-transparent text-slate-700 dark:text-slate-200 font-bold"/> 
                                <button onClick={handleManualTrigger} className="bg-primary hover:bg-emerald-700 text-white p-1.5 rounded-lg transition"><Icon name="download" size={14}/></button> 
                            </div> 
                        </div> 
                    </div> 

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4"> 
                        <div className="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-center"><p className="text-xs text-slate-500 dark:text-slate-400 font-bold">ยอดยกมาจากเดือนก่อน</p><p className="font-bold text-lg text-slate-700 dark:text-slate-200">{formatMoney(broughtForward)}</p></div> 
                        <div className="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-xl border border-emerald-100 dark:border-emerald-900/30 shadow-sm flex flex-col justify-center"><p className="text-xs text-emerald-600 dark:text-emerald-400 font-bold">รายรับเดือนนี้</p><p className="font-bold text-lg text-emerald-700 dark:text-emerald-300">+{formatMoney(dailyStats.totalInc)}</p></div> 
                        <div className="bg-red-50 dark:bg-red-900/20 p-4 rounded-xl border border-red-100 dark:border-red-900/30 shadow-sm flex flex-col justify-center"><p className="text-xs text-red-600 dark:text-red-400 font-bold">รายจ่ายเดือนนี้</p><p className="font-bold text-lg text-red-700 dark:text-red-300">-{formatMoney(dailyStats.totalExp)}</p></div> 
                        <div className={`p-4 rounded-xl border shadow-sm flex flex-col justify-center ${totalCumulative >= 0 ? 'bg-emerald-600 border-emerald-700 text-white' : 'bg-red-500 border-red-600 text-white'}`}>
                            <p className="text-xs font-bold opacity-90">เงินคงเหลือสะสมสุทธิ</p>
                            <p className="font-bold text-2xl">{formatMoney(totalCumulative)}</p>
                        </div> 
                    </div> 

                    <div className="flex flex-wrap gap-3 mt-1">
                        <span className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg text-xs text-slate-600 dark:text-slate-300 shadow-sm flex items-center gap-1"><Icon name="trending-down" size={14} className="text-red-400"/> เฉลี่ยจ่ายวันละ: <b className="text-slate-800 dark:text-slate-100">{formatMoney(dailyStats.avgExp)}</b></span>
                        <span className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg text-xs text-slate-600 dark:text-slate-300 shadow-sm flex items-center gap-1"><Icon name="flame" size={14} className="text-orange-500"/> จ่ายเยอะสุดวันที่ {dailyStats.maxExpDay}: <b className="text-orange-600 dark:text-orange-400">{formatMoney(dailyStats.maxExp)}</b></span>
                        {dailyStats.avgExp > 1000 && <span className="bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900/30 px-3 py-1.5 rounded-lg text-xs text-red-600 dark:text-red-400 shadow-sm flex items-center gap-1"><Icon name="alert-circle" size={14}/> ระวัง! ค่าเฉลี่ยรายวันสูง</span>}
                    </div>

                    <div className="card-std p-6 h-72 w-full text-xs mt-2">
                        {window.Recharts ? (
                            <ResponsiveContainer>
                                <BarChart data={dailyData}>
                                    <CartesianGrid strokeDasharray="3 3"/>
                                    <XAxis dataKey="day"/>
                                    <YAxis tickFormatter={v=>`${v/1000}k`}/>
                                    <Tooltip formatter={v=>formatMoney(v)}/>
                                    <Legend/>
                                    <Bar dataKey="income" fill="#3b82f6" name="รายรับ"/>
                                    <Bar dataKey="expense" fill="#ef4444" name="รายจ่าย"/>
                                </BarChart>
                            </ResponsiveContainer>
                        ) : 'Loading...'}
                    </div> 

                    <div className="grid md:grid-cols-2 gap-6 mt-6">
                        <div className="card-std p-6 flex flex-col items-center">
                            <h3 className="font-bold text-slate-700 dark:text-slate-200 w-full mb-4 text-center">สัดส่วนการใช้จ่ายรายหมวดเดือนนี้</h3>
                            <div className="h-64 w-full text-xs">
                                {window.Recharts && categoryBreakdown.chartData.length > 0 ? (
                                    <ResponsiveContainer>
                                        <PieChart>
                                            <Pie 
                                                data={categoryBreakdown.chartData} 
                                                innerRadius={60} 
                                                outerRadius={80} 
                                                paddingAngle={5} 
                                                dataKey="value"
                                            >
                                                {categoryBreakdown.chartData.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                                ))}
                                            </Pie>
                                            <Tooltip formatter={(val)=>formatMoney(val)}/>
                                            <Legend />
                                        </PieChart>
                                    </ResponsiveContainer>
                                ) : (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400 gap-2">
                                        <Icon name="pie-chart" size={32} className="opacity-20"/>
                                        <p>ไม่มีข้อมูลรายจ่ายในเดือนนี้</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="card-std p-6 overflow-hidden flex flex-col h-[350px]">
                            <h3 className="font-bold text-slate-700 dark:text-slate-200 mb-4 border-b border-slate-100 dark:border-slate-700 pb-2">รายละเอียดค่าใช้จ่าย (เดือน {selectedMonth})</h3>
                            <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3">
                                {categoryBreakdown.chartData.length > 0 ? categoryBreakdown.chartData.map((item, index) => (
                                    <div key={item.name} className="flex items-center justify-between p-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                                        <div className="flex items-center gap-3">
                                            <div className="w-3 h-3 rounded-full" style={{backgroundColor: COLORS[index % COLORS.length]}}></div>
                                            <span className="text-sm font-bold text-slate-700 dark:text-slate-200">{item.name}</span>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-sm font-bold text-red-500 dark:text-red-400 block">{formatMoney(item.value)}</span>
                                            <span className="text-[10px] text-slate-400 bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded">{item.percent.toFixed(1)}%</span>
                                        </div>
                                    </div>
                                )) : (
                                    <div className="h-full flex items-center justify-center">
                                        <p className="text-center text-slate-400">ยังไม่มีรายการบันทึก</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div> 
            ) 
        };

        // --- 5. Assets ---
        const Assets = ({ data, onUpdateAssets, onUpdateProfile, onUpdateDcaPlans, onBatchAddTransaction, initialTab = 'portfolio' }) => { 
            const [tab, setTab] = useState(initialTab); 
            useEffect(()=>{ setTab(initialTab) },[initialTab]); 
            
            const [ci, setCi] = useState({ principal: 100000, monthly: 5000, rate: 5, years: 10, result: 0 }); 
            const [dcaForm, setDcaForm] = useState({ assetName: '', amount: '', dayOfMonth: '1' }); 
            const [investForm, setInvestForm] = useState({ assetName: '', amount: '', date: new Date().toISOString().split('T')[0] });
            const [showWithdrawModal, setShowWithdrawModal] = useState(false);
            const [withdrawForm, setWithdrawForm] = useState({ amount: '', assetName: '', date: new Date().toISOString().split('T')[0] });
            const [newManualAsset, setNewManualAsset] = useState({ name: '', value: '' });

            useEffect(() => { const r = ci.rate / 100 / 12; const n = ci.years * 12; const fv = ci.principal * Math.pow(1+r, n) + (ci.monthly * (Math.pow(1+r, n) - 1)) / r; setCi(prev => ({...prev, result: fv})); }, [ci.principal, ci.monthly, ci.rate, ci.years]); 
            
            // --- DCA Functions ---
            const handleAddDca = (e) => { e.preventDefault(); if(!dcaForm.assetName || !dcaForm.amount) return; onUpdateDcaPlans([...(data.dcaPlans || []), { id: generateId(), ...dcaForm, amount: parseFloat(dcaForm.amount), active: true }]); setDcaForm({ assetName: '', amount: '', dayOfMonth: '1' }); }; 
            
            const isPaidThisMonth = (plan) => {
                const currentMonth = new Date().toISOString().slice(0, 7);
                return data.transactions.some(t => 
                    t.type === 'expense' && 
                    t.date.startsWith(currentMonth) && 
                    t.note?.includes(plan.assetName) &&
                    Math.abs(parseFloat(t.amount) - plan.amount) < 100
                );
            };

            const handleProcessDca = (plan) => {
                if (!validateBalance(plan.amount, data.transactions)) return;
                
                if(confirm(`ยืนยันการออม DCA "${plan.assetName}" ยอด ${formatMoney(plan.amount)}?`)) {
                     onBatchAddTransaction([{
                        id: generateId(),
                        type: 'expense',
                        amount: plan.amount,
                        category: 'การลงทุน',
                        date: new Date().toISOString().split('T')[0],
                        note: `Auto: ออม DCA: ${plan.assetName}`
                    }]);
                }
            };

            // --- One-Time Invest Function ---
            const handleOneTimeInvest = (e) => {
                e.preventDefault();
                if(!investForm.assetName || !investForm.amount) return;
                
                const amount = parseFloat(investForm.amount);
                if (!validateBalance(amount, data.transactions)) return;
                
                if(confirm(`ยืนยันการซื้อ "${investForm.assetName}" ยอด ${formatMoney(amount)}?`)) {
                    onBatchAddTransaction([{
                        id: generateId(),
                        type: 'expense',
                        amount: amount,
                        category: 'การลงทุน',
                        date: investForm.date,
                        note: `ลงทุน: ${investForm.assetName}`
                    }]);
                    alert('บันทึกการลงทุนเรียบร้อย ข้อมูลจะถูกนำไปรวมในพอร์ตการลงทุน');
                    setInvestForm({ assetName: '', amount: '', date: new Date().toISOString().split('T')[0] });
                }
            };

            // --- Add Manual Asset Function ---
            const handleAddManualAsset = (e) => {
                e.preventDefault();
                if (!newManualAsset.name) return;
                const updated = [...(data.assets || []), {
                    id: generateId(),
                    name: newManualAsset.name,
                    type: 'อื่นๆ',
                    value: newManualAsset.value 
                }];
                onUpdateAssets(updated);
                setNewManualAsset({ name: '', value: '' });
            };

            // --- Investment Stats & Time Series Calculation ---
            const dcaStats = useMemo(() => {
                const stats = {};
                let totalVal = 0;

                data.transactions.forEach(t => {
                    if (t.type === 'expense' && t.note && (t.note.includes('Auto: ออม DCA:') || t.note.includes('ลงทุน:'))) {
                        let assetName = '';
                        if (t.note.includes('Auto: ออม DCA:')) assetName = t.note.split('Auto: ออม DCA: ')[1]?.trim();
                        else if (t.note.includes('ลงทุน:')) assetName = t.note.split('ลงทุน: ')[1]?.trim();
                        
                        if (assetName) stats[assetName] = (stats[assetName] || 0) + parseFloat(t.amount);
                    }
                    if (t.type === 'income' && t.note && t.note.includes('ถอน DCA:')) {
                        const assetName = t.note.split('ถอน DCA: ')[1]?.trim();
                        if (assetName) stats[assetName] = (stats[assetName] || 0) - parseFloat(t.amount);
                    }
                });

                const chartData = Object.entries(stats)
                    .map(([name, value]) => ({ name, value }))
                    .filter(item => item.value > 0)
                    .sort((a, b) => b.value - a.value);

                totalVal = chartData.reduce((acc, curr) => acc + curr.value, 0);
                const finalData = chartData.map(item => ({...item, percent: totalVal > 0 ? (item.value / totalVal) * 100 : 0 }));

                return { stats, chartData: finalData, totalVal };
            }, [data.transactions]);

            const portfolioTimeData = useMemo(() => {
                const monthlyInvested = {};
                let minDate = new Date().toISOString().slice(0, 7);
                let maxDate = new Date().toISOString().slice(0, 7);

                data.transactions.forEach(t => {
                    if (t.type === 'expense' && t.note && (t.note.includes('Auto: ออม DCA:') || t.note.includes('ลงทุน:'))) {
                        const m = t.date.slice(0, 7);
                        if (m < minDate) minDate = m;
                        if (m > maxDate) maxDate = m;
                        monthlyInvested[m] = (monthlyInvested[m] || 0) + parseFloat(t.amount);
                    }
                    if (t.type === 'income' && t.note && t.note.includes('ถอน DCA:')) {
                        const m = t.date.slice(0, 7);
                        if (m < minDate) minDate = m;
                        if (m > maxDate) maxDate = m;
                        monthlyInvested[m] = (monthlyInvested[m] || 0) - parseFloat(t.amount);
                    }
                });

                const result = [];
                let cumulative = 0;
                let current = new Date(`${minDate}-01`);
                const end = new Date(`${maxDate}-01`);
                
                while (current <= end) {
                    const mStr = current.toISOString().slice(0, 7);
                    const netInvest = monthlyInvested[mStr] || 0;
                    cumulative += netInvest;
                    result.push({
                        month: new Date(mStr).toLocaleDateString('th-TH', { month: 'short', year: '2-digit' }),
                        invested: netInvest,
                        cumulative: cumulative
                    });
                    current.setMonth(current.getMonth() + 1);
                }
                if (result.length === 0) {
                     result.push({ month: new Date().toLocaleDateString('th-TH', { month: 'short', year: '2-digit' }), invested: 0, cumulative: 0 });
                }
                return result;
            }, [data.transactions]);

            const manualAssetsChartData = useMemo(() => {
                const assets = (data.assets || []).map(a => ({
                    ...a,
                    numericValue: parseFloat(a.value) || 0
                })).filter(a => a.numericValue > 0);
                
                const total = assets.reduce((acc, curr) => acc + curr.numericValue, 0);
                return {
                    list: assets.map(a => ({...a, percent: total > 0 ? (a.numericValue / total) * 100 : 0})),
                    total
                };
            }, [data.assets]);

            const handleWithdraw = (e) => {
                e.preventDefault();
                const amount = parseFloat(withdrawForm.amount);
                if(!amount || !withdrawForm.assetName) return;

                const currentAvailable = dcaStats.stats[withdrawForm.assetName] || 0;
                if(amount > currentAvailable) {
                    alert(`ยอดเงินที่ถอนได้ไม่เพียงพอ! คุณมี "${withdrawForm.assetName}" สะสมอยู่ ${formatMoney(currentAvailable)}`);
                    return;
                }

                if(confirm(`ยืนยันการถอนเงิน ${formatMoney(amount)} จาก "${withdrawForm.assetName}"?`)) {
                    onBatchAddTransaction([{
                        id: generateId(),
                        type: 'income',
                        amount: amount,
                        category: 'การลงทุน', 
                        date: withdrawForm.date,
                        note: `ถอน DCA: ${withdrawForm.assetName}`
                    }]);
                    alert("ถอนเงินสำเร็จ! ยอดเงินถูกบันทึกเป็นรายรับและเพิ่มเข้าเงินคงเหลือเรียบร้อยแล้ว");
                    setWithdrawForm({ amount: '', assetName: '', date: new Date().toISOString().split('T')[0] });
                    setShowWithdrawModal(false);
                }
            };

            return ( <div className="space-y-6 pb-24 animate-fade-in"><div className="flex gap-4 border-b border-slate-200 dark:border-slate-700 pb-2 overflow-x-auto"><button onClick={()=>setTab('portfolio')} className={`font-bold pb-2 px-2 whitespace-nowrap ${tab==='portfolio'?'text-primary dark:text-emerald-400 border-b-2 border-primary dark:border-emerald-400':'text-slate-400 dark:text-slate-500'}`}>พอร์ตลงทุน</button><button onClick={()=>setTab('dca')} className={`font-bold pb-2 px-2 whitespace-nowrap ${tab==='dca'?'text-primary dark:text-emerald-400 border-b-2 border-primary dark:border-emerald-400':'text-slate-400 dark:text-slate-500'}`}>แผน DCA & ซื้อปกติ</button><button onClick={()=>setTab('tools')} className={`font-bold pb-2 px-2 whitespace-nowrap ${tab==='tools'?'text-primary dark:text-emerald-400 border-b-2 border-primary dark:border-emerald-400':'text-slate-400 dark:text-slate-500'}`}>คำนวณดอกเบี้ย</button></div> 
            
            {tab === 'portfolio' && (
                <div className="space-y-6">
                    <div className="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-3xl p-6 md:p-8 text-white shadow-lg relative overflow-hidden flex flex-col md:flex-row justify-between md:items-center gap-4">
                        <div className="absolute top-0 right-0 p-4 opacity-10"><Icon name="trending-up" size={120} /></div>
                        <div className="relative z-10">
                            <p className="text-emerald-100 text-sm mb-1 flex items-center gap-2"><Icon name="pie-chart" size={16}/> พอร์ตการลงทุนรวมของคุณ (Total Wealth)</p>
                            <h2 className="text-4xl md:text-5xl font-bold tracking-tight">{formatMoney(dcaStats.totalVal + manualAssetsChartData.total)}</h2>
                            <p className="text-xs text-emerald-100 mt-2 opacity-80 flex gap-4">
                                <span>จากประวัติการซื้อ: {formatMoney(dcaStats.totalVal)}</span>
                                <span>|</span>
                                <span>จากสินทรัพย์ที่บันทึกเอง: {formatMoney(manualAssetsChartData.total)}</span>
                            </p>
                        </div>
                        <div className="relative z-10">
                             <button onClick={() => setShowWithdrawModal(true)} className="bg-white/20 hover:bg-white/30 text-white px-5 py-2.5 rounded-xl font-bold shadow-sm transition backdrop-blur-sm border border-white/20 flex items-center gap-2 w-full md:w-auto justify-center">
                                <Icon name="log-out" size={18}/> ถอนเงินลงทุน
                            </button>
                        </div>
                    </div>

                    <div className="space-y-6">
                        <div className="card-std p-5 w-full">
                            <h3 className="font-bold text-slate-700 dark:text-slate-200 mb-4 flex items-center gap-2"><Icon name="bar-chart-2" className="text-blue-500"/> การเติบโตของพอร์ตลงทุน (คำนวณจากประวัติการซื้อเท่านั้น)</h3>
                            <div className="h-72 w-full text-xs">
                                {window.Recharts ? (
                                    <ResponsiveContainer>
                                        <ComposedChart data={portfolioTimeData}>
                                            <CartesianGrid strokeDasharray="3 3"/>
                                            <XAxis dataKey="month" scale="band" />
                                            <YAxis yAxisId="left" tickFormatter={v=>`${v/1000}k`} />
                                            <YAxis yAxisId="right" orientation="right" tickFormatter={v=>`${v/1000}k`} />
                                            <Tooltip formatter={(value, name) => [formatMoney(value), name === 'invested' ? 'ยอดลงทุนเดือนนี้' : 'มูลค่าสะสม']} />
                                            <Legend />
                                            <Bar yAxisId="left" dataKey="invested" barSize={30} fill="#3b82f6" name="ยอดลงทุนสุทธิ (รายเดือน)" radius={[4, 4, 0, 0]} />
                                            <Line yAxisId="right" type="monotone" dataKey="cumulative" stroke="#059669" strokeWidth={3} dot={{ r: 4, strokeWidth: 2 }} activeDot={{ r: 6 }} name="มูลค่าพอร์ตสะสม" />
                                            <Scatter yAxisId="right" dataKey="cumulative" fill="#059669" />
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                ) : <div className="text-center text-slate-400 mt-10">Loading Chart...</div>}
                            </div>
                        </div>

                 suggestedSaving = (shortfall * r) / (Math.pow(1 + r, monthsToInvest) - 1);
